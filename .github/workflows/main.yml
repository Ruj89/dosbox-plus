name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_VERSION: 8.10.2
  ANDROID_PLATFORM: "35"
  ANDROID_NDK: 27.2.12479018
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: ''
          accept-android-sdk-licenses: 'false'

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;35.0.0" "build-tools;34.0.0" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Fetch pinned dosbox-libretro sources
        run: bash scripts/fetch-libretro.sh

      - name: Run JVM tests
        run: gradle --no-daemon --console=plain test

      - name: Decode release keystore (if secrets present)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          if [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 is set, but RELEASE_STORE_PASSWORD is missing: the release will not be signed."
          fi

      - name: Build release APKs
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK }}
        run: |
          if [ -z "${RELEASE_STORE_FILE:-}" ]; then
            echo "::notice::No release keystore configured: building unsigned release APKs."
          fi
          gradle --no-daemon --console=plain assembleRelease
          ls -l app/build/outputs/apk/release/

      - name: Checksum APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          (cd dist && sha256sum *.apk > release-apks.sha256)
          cat dist/release-apks.sha256

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            dist/*.apk
            dist/release-apks.sha256
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: release-apks

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/*.apk
            release-apks/release-apks.sha256
          generate_release_notes: true
